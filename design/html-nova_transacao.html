<!-- Primary CTA Action Button -->
<div class="w-full">
<button class="w-full py-3.5 px-4 rounded-xl font-title-md text-title-md font-semibold text-on-primary bg-gradient-to-r from-primary-container via-primary to-secondary-container shadow-[0_0_24px_-4px_rgba(78,222,163,0.4)] active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="btn-save-transaction" onclick="saveTransaction()" type="button">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span>Salvar Transação</span>
</button>
</div>
<!-- Success Toast Overlay -->
<div class="fixed bottom-6 left-4 right-4 z-50 transform translate-y-32 opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center gap-3 p-3.5 bg-surface-container-highest text-on-surface rounded-xl shadow-2xl" id="toast-success">
<div class="w-9 h-9 rounded-full bg-primary/20 flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[22px]">done_all</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-title-md text-title-md text-on-surface leading-tight">Transação Registrada!</p>
<p class="font-body-sm text-body-sm text-on-surface-variant truncate" id="toast-summary">R$ 184,50 em Alimentação</p>
</div>
</div>
</div>
<script>
  let currentAmountCents = 18450;
  let currentInstallments = 3;

  function formatBRL(cents) {
    const value = cents / 100;
    return value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function updateDisplay() {
    const disp = document.getElementById('amount-display');
    if (disp) {
      disp.textContent = formatBRL(currentAmountCents);
    }
    updateInstallments(currentInstallments);
  }

  function adjustAmount(valReais) {
    const deltaCents = valReais * 100;
    currentAmountCents = Math.max(0, currentAmountCents + deltaCents);
    updateDisplay();
  }

  function toggleCustomKeypad() {
    const pad = document.getElementById('keypad-panel');
    if (pad) {
      pad.classList.toggle('hidden');
      pad.classList.toggle('grid');
    }
  }

  function appendDigit(digit) {
    if (currentAmountCents > 10000000) return;
    const currentStr = currentAmountCents.toString();
    const newStr = (currentStr === '0' ? '' : currentStr) + digit;
    currentAmountCents = parseInt(newStr, 10) || 0;
    updateDisplay();
  }

  function popDigit() {
    const currentStr = currentAmountCents.toString();
    if (currentStr.length <= 1) {
      currentAmountCents = 0;
    } else {
      currentAmountCents = parseInt(currentStr.slice(0, -1), 10);
    }
    updateDisplay();
  }

  function clearAmount() {
    currentAmountCents = 0;
    updateDisplay();
  }

  function switchType(type) {
    const expenseBtn = document.getElementById('btn-type-expense');
    const incomeBtn = document.getElementById('btn-type-income');
    const transferBtn = document.getElementById('btn-type-transfer');
    const installSec = document.getElementById('installments-section');

    const defaultClass = 'py-2 rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1';
    const activeClass = 'py-2 rounded-full font-label-md text-label-md transition-all duration-200 bg-primary-container text-on-primary-container shadow-md flex items-center justify-center gap-1';

    expenseBtn.className = defaultClass;
    incomeBtn.className = defaultClass;
    transferBtn.className = defaultClass;

    if (type === 'expense') {
      expenseBtn.className = activeClass;
      if (installSec) installSec.classList.remove('hidden');
    } else if (type === 'income') {
      incomeBtn.className = activeClass;
      if (installSec) installSec.classList.add('hidden');
    } else {
      transferBtn.className = activeClass;
      if (installSec) installSec.classList.add('hidden');
    }
  }

  function selectCategory(el, name) {
    const allPills = document.querySelectorAll('.cat-pill');
    allPills.forEach(pill => {
      pill.className = 'cat-pill relative flex flex-col items-center justify-center py-2.5 px-1 rounded-lg bg-surface-container-low text-on-surface-variant hover:text-on-surface transition-all';
    });
    el.className = 'cat-pill active-cat relative flex flex-col items-center justify-center py-2.5 px-1 rounded-lg bg-surface-container-high text-primary shadow-[0_0_15px_-3px_rgba(78,222,163,0.35)] transition-all';
    
    const label = document.getElementById('selected-cat-name');
    if (label) label.textContent = name;
  }

  function selectDate(el, name) {
    const allDates = document.querySelectorAll('.date-chip');
    allDates.forEach(btn => {
      btn.className = 'date-chip py-2 px-2 rounded-lg bg-surface-container-low text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors flex items-center justify-center gap-1';
    });
    el.className = 'date-chip py-2 px-2 rounded-lg bg-primary/15 text-primary font-label-md text-label-md transition-colors flex items-center justify-center gap-1';
  }

  function selectPayment(el, name) {
    const allPays = document.querySelectorAll('.pay-chip');
    allPays.forEach(btn => {
      btn.className = 'pay-chip py-2.5 px-2 rounded-lg bg-surface-container-low text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-colors flex flex-col items-center justify-center gap-0.5';
    });
    el.className = 'pay-chip py-2.5 px-2 rounded-lg bg-primary/15 text-primary font-label-md text-label-md transition-colors flex flex-col items-center justify-center gap-0.5';

    const installSec = document.getElementById('installments-section');
    if (installSec) {
      if (name === 'Cartão Black') {
        installSec.classList.remove('opacity-40', 'pointer-events-none');
      } else {
        installSec.classList.add('opacity-40', 'pointer-events-none');
      }
    }
  }

  function updateInstallments(val) {
    currentInstallments = parseInt(val, 10);
    const range = document.getElementById('installment-range');
    if (range && range.value !== val) range.value = val;

    const lbl = document.getElementById('installment-label');
    const calc = document.getElementById('installment-calc');

    if (currentInstallments <= 1) {
      if (lbl) lbl.textContent = '1x';
      if (calc) calc.textContent = '(À vista)';
    } else {
      const partCents = Math.round(currentAmountCents / currentInstallments);
      if (lbl) lbl.textContent = currentInstallments + 'x';
      if (calc) calc.textContent = '(' + currentInstallments + 'x de R$ ' + formatBRL(partCents) + ')';
    }
  }

  function removeReceipt() {
    const box = document.getElementById('receipt-preview-box');
    const status = document.getElementById('receipt-status');
    if (box) box.classList.add('hidden');
    if (status) status.textContent = 'Nenhum anexo';
  }

  function mockUploadReceipt() {
    const box = document.getElementById('receipt-preview-box');
    const status = document.getElementById('receipt-status');
    if (box) box.classList.remove('hidden');
    if (status) status.textContent = '1 anexo';
  }

  function saveTransaction() {
    const toast = document.getElementById('toast-success');
    const desc = document.getElementById('input-desc')?.value || 'Transação';
    const cat = document.getElementById('selected-cat-name')?.textContent || 'Geral';
    const sum = document.getElementById('toast-summary');

    if (sum) {
      sum.textContent = 'R$ ' + formatBRL(currentAmountCents) + ' • ' + desc + ' (' + cat + ')';
    }

    if (toast) {
      toast.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3200);
    }
  }

  // Initialize calculations
  updateDisplay();
</script></main></body></html>
